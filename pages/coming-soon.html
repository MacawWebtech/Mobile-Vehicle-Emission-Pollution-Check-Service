  <script>
    /* Apply saved theme + direction before first paint (prevents a flash). */
    (function () {
      var d = document.documentElement, t = null, r = null;
      try { t = localStorage.getItem("cw-theme"); r = localStorage.getItem("cw-dir"); } catch (e) {}
      d.setAttribute("data-bs-theme", t || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
      if (r === "rtl") { d.setAttribute("dir", "rtl"); document.getElementById("bootstrap-css").href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"; }
    })();
  </script>

<a class="skip-link" href="#main">Skip to main content</a>
<header class="container d-flex justify-content-between align-items-center py-3">
  <a class="cw-logo" href="index.html" aria-label="Clearway home"><img src="../assets/images/logo-mark.svg" alt="" width="40" height="40"><span class="cw-logo-text">Clearway<small>Mobile Emission Check</small></span></a>
  <div class="cw-header-tools"><button type="button" class="btn btn-ghost btn-icon theme-toggle" aria-label="Switch to dark mode" aria-pressed="false">
          <i class="bi bi-moon-stars icon-light" aria-hidden="true"></i><i class="bi bi-sun icon-dark" aria-hidden="true"></i>
        </button>
        <button type="button" class="btn btn-ghost btn-icon dir-toggle" aria-label="Switch to right-to-left layout" aria-pressed="false">
          <span class="dir-label">RTL</span>
        </button></div>
</header>
<main id="main" class="cw-center-page">
  <div class="container text-center">
    <div class="cw-hero-art mx-auto" style="max-width:560px"><img src="../assets/images/service%20banner.jpg" sizes="(min-width: 768px) 560px, 100vw" alt="A car raised on a workshop lift during maintenance" width="1100" height="600" data-photo="coming-soon"></div>
    <p class="cw-eyebrow justify-content-center mt-3">Scheduled maintenance</p>
    <h1>We're tuning up. Back very soon.</h1>
    <p class="cw-lead mx-auto" style="max-width:560px">Our booking system is getting an upgrade. Existing bookings are not affected — your technician will still arrive on time.</p>
    <div class="cw-countdown my-5" data-countdown="2026-12-01T09:00:00" role="timer" aria-label="Time until we're back">
      <div><strong data-unit="d">00</strong><span>Days</span></div><div><strong data-unit="h">00</strong><span>Hours</span></div><div><strong data-unit="m">00</strong><span>Minutes</span></div><div><strong data-unit="s">00</strong><span>Seconds</span></div>
    </div>
    <form class="cw-validate mx-auto" style="max-width:460px" action="https://formspree.io/f/YOUR_FORM_ID" method="post" data-success="Done! We'll text you the moment bookings reopen.">
      <div class="cw-field text-start"><label class="form-label" for="csPhone">Get a text when we're back</label>
        <div class="d-flex gap-2"><input class="form-control" id="csPhone" type="tel" name="phone" inputmode="tel" placeholder="10-digit mobile number" required pattern="[+]?[0-9 ]{10,14}" data-msg-required="Add your number and we'll text you." data-msg-pattern="Please enter a 10-digit mobile number."><button class="btn btn-cw" type="submit">Notify me</button></div>
        <div class="invalid-feedback"></div></div>
      <div class="cw-form-status mt-3" role="status" tabindex="-1"></div>
    </form>
    <p class="mt-4 small">Urgent? Call <a href="tel:+911800001234" class="ltr fw-bold">1800-000-1234</a></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
